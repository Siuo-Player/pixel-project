# Publica a app estática no GitHub Pages a cada push na main.
# Requer Pages com source "GitHub Actions" (o passo configure-pages ativa automaticamente).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build static site
        run: node scripts/build-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
