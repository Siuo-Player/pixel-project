# OpenCode deve correr num runner do GitHub Actions.
# A revisão é opcional: sem o secret ANTHROPIC_API_KEY, é ignorada sem falhar a CI.
# Para outro provedor, altere o modelo, o secret e o verificador de configuração.
name: OpenCode review
on:
  pull_request:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenCode provider configuration
        id: provider
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/check-opencode-review-config.mjs
      - name: Install OpenCode CLI
        if: steps.provider.outputs.configured == 'true'
        run: npm install --global @opencode/cli
      - name: Review pull request
        if: steps.provider.outputs.configured == 'true'
        run: opencode run --standalone --model anthropic/claude-sonnet-5-5 "Review this repository for correctness and summarize any issues."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
