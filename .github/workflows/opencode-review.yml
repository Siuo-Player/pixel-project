# OpenCode deve correr num runner do GitHub Actions.
# A revisão é opcional: sem o secret OPENCODE_API_KEY, é ignorada sem falhar a CI.
# Modelo por omissão: GLM-5.3-Flash grátis (custo 0) via provedor OpenCode.
# Pode ser trocado sem editar este ficheiro com a variável de repositório
# OPENCODE_REVIEW_MODEL (Settings > Secrets and variables > Actions > Variables).
# Para outro provedor, altere o secret e o verificador de configuração.
# Nota de privacidade: modelos gratuitos do OpenCode podem reter os dados enviados.
name: OpenCode review
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OpenCode provider configuration
        id: provider
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: node scripts/check-opencode-review-config.mjs
      - uses: actions/setup-node@v4
        if: steps.provider.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install OpenCode CLI
        if: steps.provider.outputs.configured == 'true'
        run: npm install --global @opencode/cli@2
      - name: Review pull request
        if: steps.provider.outputs.configured == 'true'
        run: opencode run --standalone --model "$OPENCODE_REVIEW_MODEL" "Review this repository for correctness and summarize any issues."
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_REVIEW_MODEL: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode/glm-5.3-flash-free' }}
